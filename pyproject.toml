[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opensubsurface"
version = "0.1.0"
description = "Reproducible subsurface observability experiments"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "simpeg==0.25.2",
  "discretize==0.12.0",
  "pymatsolver==0.4.0",
  "pygimli==1.6.1",
  "pgcore==1.6.0",
  "psutil==7.2.2",
  "matplotlib==3.11.2",
  "pyamg==5.3.0",
  "tetgen==0.8.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
opensubsurface-ert = "opensubsurface.pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["F", "E9"]
